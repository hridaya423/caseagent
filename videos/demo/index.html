<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="content/cases.js"></script>
    <script src="content/captions.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f4f5f7;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #f4f5f7;
      }
      /* Recordings play inside the window drawn by compositions/rec-frame.html. */
      .rec {
        position: absolute;
        left: 192px;
        top: 112px;
        width: 1536px;
        height: 864px;
        border-radius: 16px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="title" class="clip" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="twin" class="clip" data-composition-id="twin" data-composition-src="compositions/twin.html" data-start="5" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="frame-run" class="clip" data-composition-id="rec-frame" data-composition-src="compositions/rec-frame.html" data-variable-values='{"step":"1","title":"Both cases run through the agent (sped up)","todo":"Terminal, two panes: the run command on the left, the live trace of case 206 on the right."}' data-start="13" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="frame-decision" class="clip" data-composition-id="rec-frame" data-composition-src="compositions/rec-frame.html" data-variable-values='{"step":"2","title":"Same case, opposite decisions","todo":"Dashboard, run demo: case 110 on hold, its email to the contractor. Then case 206: escalated, the gas SMS in the outbox, the handover fields."}' data-start="22" data-duration="13" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="frame-guard" class="clip" data-composition-id="rec-frame" data-composition-src="compositions/rec-frame.html" data-variable-values='{"step":"3","title":"Guards check every tool call","todo":"Dashboard, run demo, case 206, Actions tab: the refused escalate (Guard callout), then the clean escalate that followed."}' data-start="35" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="frame-evals" class="clip" data-composition-id="rec-frame" data-composition-src="compositions/rec-frame.html" data-variable-values='{"step":"4","title":"Tested on cases it has never seen","todo":"The reality-sim run in the dashboard (status bar, case table), then SCORECARD.md with the pass rate."}' data-start="43" data-duration="9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Recordings: uncomment each line once its file exists (1920x1080 MP4, trimmed to the slot). -->
      <!-- <video id="rec-run" class="clip rec" src="recordings/run.mp4" muted playsinline data-start="13" data-duration="9" data-track-index="2"></video> -->
      <!-- <video id="rec-decision" class="clip rec" src="recordings/decision.mp4" muted playsinline data-start="22" data-duration="13" data-track-index="2"></video> -->
      <!-- <video id="rec-guard" class="clip rec" src="recordings/guard.mp4" muted playsinline data-start="35" data-duration="8" data-track-index="2"></video> -->
      <!-- <video id="rec-evals" class="clip rec" src="recordings/evals.mp4" muted playsinline data-start="43" data-duration="9" data-track-index="2"></video> -->

      <div id="close" class="clip" data-composition-id="close" data-composition-src="compositions/close.html" data-start="52" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="60" data-track-index="3" data-track-kind="captions" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
